<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>drop.</title><style>:root{color-scheme:dark;--bg:#0b0911;--card:#15121e;--border:#292334;--text:#f3effa;--muted:#8f869e;--violet:#8a5cf6;--violet2:#ad85ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);width:304px;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}.app{padding:19px 18px 15px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:21px}.brand{display:flex;align-items:center;gap:4px;font-size:24px;line-height:1;font-weight:780;letter-spacing:-1.1px}.mark{display:grid;place-items:center;height:27px;width:27px;border-radius:9px;background:#261938;color:#bd9aff;font-size:22px;line-height:1;font-weight:500;margin-right:4px}.dot{color:var(--violet2);margin-left:-5px}.media{display:flex;gap:11px;align-items:center;margin-bottom:20px;min-height:69px}.media img{width:112px;height:63px;object-fit:cover;flex-shrink:0;background:#201a2d;border:1px solid #30293c;border-radius:8px}.details{min-width:0;flex:1}.eyebrow{color:#9486b0;font-size:9px;font-weight:700;letter-spacing:1.1px;margin-bottom:4px}.video-title{font-size:12.5px;line-height:1.4;font-weight:630;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-height:36px}.format{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;background:#17121f;border-radius:12px;padding:5px}.format button{border:0;border-radius:9px;background:transparent;color:#8e829f;font-weight:650;font-size:13px;padding:10px;cursor:pointer}.format button.selected{background:#322044;color:#e3cbff;box-shadow:0 1px 3px #0004}.quality-line{display:flex;align-items:center;justify-content:space-between;margin:0 2px 18px;color:var(--muted);font-size:12px}select{color:#c7b4ee;background:transparent;border:0;font-weight:650;font-size:12px;text-align:right;outline:none;cursor:pointer}option{background:#241b31;color:#fff}.download{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:44px;border:0;border-radius:11px;color:#fff;background:linear-gradient(125deg,#8954ef,#6c44c7);font-size:13px;font-weight:730;cursor:pointer;box-shadow:0 5px 15px #6a36b02a}.download:hover{background:linear-gradient(125deg,#9d70f6,#7b4bdf)}.download:disabled{opacity:.47;cursor:default}.status{color:var(--muted);font-size:11px;min-height:18px;margin:12px 2px 0;text-align:center}.status.error{color:#ffa7aa}.status.success{color:#a4deb9}.hidden{display:none!important}.empty{font-size:12px;color:#aea2bc;text-align:center;padding:21px 7px;border:1px dashed #332b40;border-radius:11px;margin-bottom:10px}
</style></head>
<body>
<main class="app">
  <header><div class="brand"><span class="mark">↓</span> drop<span class="dot">.</span></div></header>
  <section id="mainPane">
    <div id="media" class="media"><img id="thumbnail" alt="Video thumbnail"/><div class="details"><div class="eyebrow">CURRENT VIDEO</div><div id="videoTitle" class="video-title">Finding video…</div></div></div>
    <div id="empty" class="empty hidden">Open a YouTube video to use drop.</div>
    <div id="downloadControls">
      <div class="format" role="group" aria-label="Format"><button id="mp4" class="selected">MP4</button><button id="mp3">MP3</button></div>
      <div class="quality-line"><span id="qualityLabel">Quality</span><select id="quality" aria-label="Quality"></select></div>
      <button id="download" class="download"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M5 18v3h14v-3"/></svg><span id="downloadText">Download MP4</span></button>
      <div id="status" class="status" role="status" aria-live="polite">Ready when you are.</div>
    </div>
  </section>
</main>
<script src="main.js"></script>
</body>
</html>
