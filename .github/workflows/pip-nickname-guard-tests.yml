name: Pip nickname guard tests
on:
  push:
    paths:
      - 'discord app/pip-nickname-guard.mjs'
      - 'discord app/pip-nickname-guard.test.mjs'
      - '.github/workflows/pip-nickname-guard-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test nickname restoration and notification safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test "discord app/pip-nickname-guard.test.mjs"
