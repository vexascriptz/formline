name: Apply Formline product-first Discord layout
# Re-apply once to enforce product/forum tags
on:
  push:
    paths:
      - '.github/workflows/apply-formline-layout-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formline-daki-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Reorganize Formline Discord safely
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate new Pip and server code
        run: |
          node --check "discord app/pip-runtime.mjs"
          node --check "discord app/formline-layout-v2.mjs"
          node --check .github/scripts/apply-formline-layout-v2.mjs
      - name: Install product-first server layout with backup
        env:
          DAKI_API_KEY: ${{ secrets.DAKI_API_KEY }}
        run: node .github/scripts/apply-formline-layout-v2.mjs
