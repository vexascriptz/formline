name: Package drop extension for friends
on:
  push:
    branches: [drop-daki]
    paths:
      - '.github/workflows/drop-package.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drop-daki
      - name: Build standalone ZIP with manifest in drop folder
        run: |
          set -euo pipefail
          mkdir -p downloads build/drop
          cp extension/manifest.json extension/popup.html extension/main.js build/drop/
          cd build
          zip -X -9 -q ../downloads/drop-v0.8.zip drop/manifest.json drop/main.js drop/popup.html
          cd ..
          unzip -t downloads/drop-v0.8.zip
          sha256sum downloads/drop-v0.8.zip
      - name: Publish downloadable archive
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/drop-v0.8.zip
          if git diff --cached --quiet; then
            echo "Archive already up to date"
            exit 0
          fi
          git commit -m "Publish drop v0.8 private beta ZIP"
          git push origin HEAD:drop-daki
