name: Verify Formline Discord layout and forum tags
on:
  push:
    paths:
      - '.github/workflows/verify-formline-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check .github/scripts/verify-formline-layout.mjs
      - name: Verify live Formline server setup
        env:
          DAKI_API_KEY: ${{ secrets.DAKI_API_KEY }}
        run: node .github/scripts/verify-formline-layout.mjs
