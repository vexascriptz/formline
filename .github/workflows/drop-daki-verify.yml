name: Verify deployed drop backend on Daki
on:
  push:
    branches: [drop-daki]
    paths: ['.github/workflows/drop-daki-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect drop backend state and health
        env:
          DAKI_API_KEY: ${{ secrets.DAKI_API_KEY }}
        run: node .github/scripts/verify-drop-daki.mjs
