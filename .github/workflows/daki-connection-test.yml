name: Daki connection test (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formline-daki-connection-test
  cancel-in-progress: false

jobs:
  test:
    name: Verify API access to Formline server
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out Formline
        uses: actions/checkout@v4

      - name: Check Daki connection without changing anything
        env:
          DAKI_API_KEY: ${{ secrets.DAKI_API_KEY }}
        run: node .github/scripts/check-daki.mjs
