name: Sync Formline Discord invite everywhere reachable

on:
  push:
    paths:
      - '.github/workflows/sync-formline-invite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formline-daki-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Check Daki source files and live Cloudflare links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate invite sweep script
        run: node --check .github/scripts/sync-live-invites.mjs
      - name: Update stale Daki links with backups and check live services
        env:
          DAKI_API_KEY: ${{ secrets.DAKI_API_KEY }}
        run: node .github/scripts/sync-live-invites.mjs
