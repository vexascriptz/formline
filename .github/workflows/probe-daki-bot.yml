name: Probe Daki bot runtime (read only)

on:
  push:
    paths:
      - '.github/scripts/probe-daki-bot.mjs'
      - '.github/workflows/probe-daki-bot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Identify runtime without revealing bot code
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read metadata only
        env:
          DAKI_API_KEY: ${{ secrets.DAKI_API_KEY }}
        run: node .github/scripts/probe-daki-bot.mjs
