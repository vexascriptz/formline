name: Build drop. Windows installer

on:
  push:
    branches: [drop-daki]
    paths:
      - 'installer/**'
      - 'extension/**'
      - '.github/workflows/build-drop-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out drop.
        uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile a self-contained Windows executable
        shell: pwsh
        run: |
          dotnet publish ./installer/DropInstaller.csproj -c Release -r win-x64 --self-contained true -o ./dist -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path './dist/drop-setup.exe')) { throw 'Windows executable was not generated.' }
          $exe = Get-Item './dist/drop-setup.exe'
          Write-Host "Built drop-setup.exe ($([math]::Round($exe.Length / 1MB, 1)) MB)"
          Get-FileHash ./dist/drop-setup.exe -Algorithm SHA256 | Format-List
      - name: Store compiled executable
        uses: actions/upload-artifact@v4
        with:
          name: drop-setup-v0.9-windows-x64
          path: dist/drop-setup.exe
          if-no-files-found: error
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = 'drop-installer-v0.9.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'drop. 0.9 — Windows installer' --notes 'Private beta. This is an unsigned, per-user Windows installer for the drop. Chrome extension. It does not request administrator access. Chrome requires you to load the unpacked extension yourself. Review the source before running unknown software.' --latest=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag './dist/drop-setup.exe' --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
